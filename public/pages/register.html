<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro • L2 Impure</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/dynamic.css">
</head>
<body>
    <div class="auth-page">
        <!-- Left Side: Form -->
        <div class="auth-form-side">
            <div class="auth-container">
                <!-- Logo -->
                <a href="../index.html" class="auth-logo">
                    <img src="../img/logo.png" alt="L2 Impure" class="auth-logo-img">
                </a>

                <!-- Title -->
                <h1 class="auth-title">Registro</h1>

                <!-- Google Login -->
                <button class="btn-google">
                    Registrar no Google
                </button>

                <!-- Divider -->
                <div class="auth-divider">
                    <span>OU</span>
                </div>

                <!-- Error Message -->
                <div id="authError" class="auth-error"></div>

                <!-- Form -->
                <form class="auth-form" id="registerForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">
                            <span class="form-label-text">E-Mail</span>
                        </label>
                        <input 
                            type="email" 
                            class="form-input" 
                            placeholder="Digite o E-Mail"
                            name="email"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label">
                            <span class="form-label-text">Senha</span>
                            <span class="form-hint">(mínimo 6 caracteres)</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                class="form-input" 
                                placeholder="Digite a senha"
                                name="password"
                                minlength="6"
                                required
                            >
                            <button type="button" class="input-icon password-toggle">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label class="form-label">
                            <span class="form-label-text">Confirmar Senha</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                class="form-input" 
                                placeholder="Confirme a senha"
                                name="confirmPassword"
                                required
                            >
                            <button type="button" class="input-icon password-toggle">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="checkbox-group">
                        <input type="checkbox" class="checkbox-input" id="terms" required>
                        <label for="terms" class="checkbox-label">
                            Eu concordo com <a href="#">política de privacidade</a> & <a href="#">termos de uso</a>.
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-submit">Registrar-se</button>
                </form>

                <!-- Footer Link -->
                <div class="auth-footer">
                    Já possui uma conta? <a href="login.html">Entrar</a>
                </div>
            </div>

            <!-- Page Footer -->
            <div class="auth-page-footer">
                <p>© 2026 L2 Impure</p>
                <div>
                    <a href="#">TERMOS DE SERVIÇO</a>
                    <a href="#">POLÍTICA DE PRIVACIDADE</a>
                </div>
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="auth-image-side">
            <video autoplay muted loop playsinline>
                <source src="../img/video/header.mp4" type="video/mp4">
            </video>
            <div class="auth-image-overlay">
                Powered with L2 Impure
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (API.isLoggedIn()) { window.location.href = 'dashboard.html'; return; }

            // Password toggle
            document.querySelectorAll('.password-toggle').forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('input');
                    input.type = input.type === 'password' ? 'text' : 'password';
                });
            });

            // Register form
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = this.email.value.trim();
                const password = this.password.value;
                const confirmPassword = this.confirmPassword.value;
                const terms = document.getElementById('terms').checked;
                const errorDiv = document.getElementById('authError');
                const submitBtn = this.querySelector('button[type="submit"]');

                errorDiv.style.display = 'none';

                if (!email || !password || !confirmPassword) {
                    errorDiv.textContent = 'Preencha todos os campos';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (password.length < 6) {
                    errorDiv.textContent = 'Senha deve ter pelo menos 6 caracteres';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (password !== confirmPassword) {
                    errorDiv.textContent = 'As senhas não coincidem';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (!terms) {
                    errorDiv.textContent = 'Aceite os termos de uso';
                    errorDiv.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Criando conta...';

                try {
                    const data = await API.register(email, password);

                    // Mostrar mensagem de verificação (NÃO redireciona pro dashboard)
                    if (data.needsVerification) {
                        errorDiv.classList.add('auth-success');
                        errorDiv.innerHTML = '✅ Conta criada! Verifique seu email <strong>' + email + '</strong> para ativar sua conta.';
                        errorDiv.style.display = 'block';
                        submitBtn.textContent = 'Email enviado!';
                        // Desabilitar form
                        this.style.opacity = '0.5';
                        this.style.pointerEvents = 'none';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } catch (err) {
                    errorDiv.textContent = err.message;
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Registrar-se';
                }
            });
        });
    </script>
</body>
</html>
