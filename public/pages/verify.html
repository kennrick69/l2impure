<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Email - L2 Impure</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
    <style>
        .verify-container {
            text-align: center;
            padding: 60px 30px;
        }
        .verify-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .verify-title {
            color: var(--gold-primary, #c8aa6e);
            font-size: 24px;
            margin-bottom: 16px;
        }
        .verify-message {
            color: #9a9a9a;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .verify-success { color: #4ade80; }
        .verify-error { color: #ef4444; }
        .verify-loading { color: #c8aa6e; }
        .btn-login {
            display: inline-block;
            background: linear-gradient(135deg, #c8aa6e, #a08050);
            color: #1a1a2e;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }
        .btn-login:hover { opacity: 0.85; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #c8aa6e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="verify-container" id="verifyContainer">
                <div class="spinner"></div>
                <h2 class="verify-title verify-loading">Verificando email...</h2>
                <p class="verify-message">Aguarde enquanto confirmamos seu email.</p>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('verifyContainer');
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                container.innerHTML = `
                    <div class="verify-icon">❌</div>
                    <h2 class="verify-title verify-error">Link Inválido</h2>
                    <p class="verify-message">Token de verificação não encontrado.</p>
                    <a href="register.html" class="btn-login">CRIAR CONTA</a>
                `;
                return;
            }

            try {
                const data = await API.verifyEmail(token);
                container.innerHTML = `
                    <div class="verify-icon">✅</div>
                    <h2 class="verify-title verify-success">Email Verificado!</h2>
                    <p class="verify-message">${data.message || 'Sua conta foi ativada com sucesso.'}</p>
                    <a href="login.html" class="btn-login">FAZER LOGIN</a>
                `;
            } catch (err) {
                container.innerHTML = `
                    <div class="verify-icon">❌</div>
                    <h2 class="verify-title verify-error">Erro na Verificação</h2>
                    <p class="verify-message">${err.message || 'Token inválido ou já utilizado.'}</p>
                    <a href="login.html" class="btn-login">IR PARA LOGIN</a>
                `;
            }
        });
    </script>
</body>
</html>
