<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorização • L2 Impure</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/dynamic.css">
</head>
<body>
    <div class="auth-page">
        <!-- Left Side: Form -->
        <div class="auth-form-side">
            <div class="auth-container">
                <!-- Logo -->
                <a href="../index.html" class="auth-logo">
                    <img src="../img/logo.png" alt="L2 Impure" class="auth-logo-img">
                </a>

                <!-- Title -->
                <h1 class="auth-title">Autorização</h1>

                <!-- Google Login -->
                <button class="btn-google">
                    Login com Google
                </button>

                <!-- Divider -->
                <div class="auth-divider">
                    <span>OU</span>
                </div>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="email">Email</button>
                    <button class="auth-tab" data-tab="phone">Celular</button>
                </div>

                <!-- Error Message -->
                <div id="authError" class="auth-error"></div>

                <!-- Form -->
                <form class="auth-form" id="loginForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">
                            <span class="form-label-text">E-Mail</span>
                        </label>
                        <input 
                            type="email" 
                            class="form-input" 
                            placeholder="Digite o E-Mail"
                            name="email"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label">
                            <span class="form-label-text">Senha</span>
                            <a href="#" class="form-link">Esqueceu sua senha?</a>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                class="form-input" 
                                placeholder="Digite a senha"
                                name="password"
                                required
                            >
                            <button type="button" class="input-icon password-toggle">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="checkbox-group">
                        <input type="checkbox" class="checkbox-input" id="remember">
                        <label for="remember" class="checkbox-label">
                            Lembrar de mim?
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-submit">Entrar</button>
                </form>

                <!-- Footer Link -->
                <div class="auth-footer">
                    Não tem uma conta? <a href="register.html">Registrar-se</a>
                </div>
            </div>

            <!-- Page Footer -->
            <div class="auth-page-footer">
                <p>© 2026 L2 Impure</p>
                <div>
                    <a href="#">TERMOS DE SERVIÇO</a>
                    <a href="#">POLÍTICA DE PRIVACIDADE</a>
                </div>
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="auth-image-side">
            <video autoplay muted loop playsinline>
                <source src="../img/video/header.mp4" type="video/mp4">
            </video>
            <div class="auth-image-overlay">
                Powered with L2 Impure
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (API.isLoggedIn()) { window.location.href = 'dashboard.html'; return; }

            // Tab switching
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Password toggle
            document.querySelectorAll('.password-toggle').forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('input');
                    input.type = input.type === 'password' ? 'text' : 'password';
                });
            });

            // Login form
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = this.email.value.trim();
                const password = this.password.value;
                const errorDiv = document.getElementById('authError');
                const submitBtn = this.querySelector('button[type="submit"]');

                errorDiv.style.display = 'none';

                if (!email || !password) {
                    errorDiv.textContent = 'Preencha todos os campos';
                    errorDiv.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Entrando...';

                try {
                    await API.login(email, password);
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    // Se email não verificado, mostrar botão de reenvio
                    if (err.needsVerification) {
                        errorDiv.innerHTML = '⚠️ Email não verificado. <a href="#" id="resendLink" style="color:#c8aa6e;text-decoration:underline;">Reenviar email de verificação</a>';
                        errorDiv.style.display = 'block';

                        document.getElementById('resendLink').addEventListener('click', async (ev) => {
                            ev.preventDefault();
                            try {
                                await API.resendVerification(err.email);
                                errorDiv.classList.add('auth-success');
                                errorDiv.innerHTML = '✅ Email de verificação reenviado para <strong>' + err.email + '</strong>';
                            } catch (resendErr) {
                                errorDiv.textContent = resendErr.message || 'Erro ao reenviar';
                            }
                        });
                    } else {
                        errorDiv.textContent = err.message;
                        errorDiv.style.display = 'block';
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Entrar';
                }
            });
        });
    </script>
</body>
</html>
